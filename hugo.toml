baseURL = "/"
languageCode = "en-us"
title = "CMDK Addon"
theme = "hextra"

# Suppress known warnings
ignoreLogs = ["warning-goldmark-raw-html"]

# Enable Git info for last modified dates
enableGitInfo = true

[markup]
  [markup.highlight]
    noClasses = false

[params]
  description = "The command palette your browser was missing."

  # Navbar
  [params.navbar]
    displayTitle = true
    displayLogo = true
    [params.navbar.logo]
      name = "CMDK Addon"
      path = "images/logo.svg"
      dark = "images/logo-dark.svg"

  # Footer
  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = false

  # Search
  [params.search]
    enable = true
    type = "flexsearch"

  # Theme toggle (light/dark)
  [params.theme]
    default = "system"
    displayToggle = true

[menu]
  [[menu.main]]
    name = "Docs"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 2
